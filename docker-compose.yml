# Local infrastructure for the streaming demo.
#   docker compose up -d --wait kafka                      Kafka only (API run locally)
#   docker compose --profile docker-api up -d --build --wait   Kafka + API container
#   docker compose --profile platform up -d --build --wait     Kafka + streaming
#       fraud service + analyst dashboard (Feast online store starts empty
#       in its own volume; stream with the replay producer from the host)
services:
  kafka:
    # Single-node KRaft broker. Host programs connect to localhost:9092,
    # other containers to kafka:19092. Topics are auto-created.
    image: apache/kafka:3.9.0
    container_name: fraud-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  fraud-api:
    profiles: ["docker-api"]
    build: .
    image: fraud-api
    container_name: fraud-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  fraud-service:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: Dockerfile.service
    image: fraud-service
    container_name: fraud-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SERVING_DB_PATH: /app/data/serving/fraud_cases.db
    ports:
      - "8001:8001"
    volumes:
      - fraud-feast:/app/feature_repo/data
      - fraud-serving:/app/data/serving
      - fraud-drift:/app/outputs/reports/drift
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  fraud-dashboard:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: fraud-dashboard
    container_name: fraud-dashboard
    depends_on:
      fraud-service:
        condition: service_healthy
    environment:
      FRAUD_SERVICE_URL: http://fraud-service:8001
      FRAUD_SERVICE_PUBLIC_URL: http://127.0.0.1:8001
    ports:
      - "8501:8501"

volumes:
  fraud-feast:
  fraud-serving:
  fraud-drift:
