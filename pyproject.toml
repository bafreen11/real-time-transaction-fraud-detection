[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "1.1.0"
description = "PaySim transaction fraud detection with XGBoost, GraphSAGE and a FastAPI/Kafka scoring pipeline"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
