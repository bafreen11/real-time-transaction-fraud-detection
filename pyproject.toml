[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "1.1.0"
description = "PaySim transaction fraud detection with XGBoost, GraphSAGE and a FastAPI/Kafka scoring pipeline"
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src for the package, the project root for api/
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
